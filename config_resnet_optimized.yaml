# ResNet101 优化配置
# ExperimentSettings
project: 'TAG'
experiment_name: 'ResNet101_优化设置'
description: 'ResNet101针对医学图像多标签分类的优化配置'
seed: 9233

# SaveSettings
save_dir: '/hy-tmp/Results/'

# DataInputSettings
image_dir: '/hy-tmp/files256/'
image_size: 224
class_name:   
  [ Enlarged Cardiomediastinum,
    Cardiomegaly,
    Lung Opacity,
    Lung Lesion,
    Edema,
    Consolidation,
    Pneumonia,
    Atelectasis,
    Pneumothorax,
    Pleural Effusion,
    Pleural Other,
    Fracture,
    Support Devices,
    No Finding ]
class_instance_nums:
  [ 30119,
    76900,
    79931,
    2533,
    38574,
    16038,
    48093,
    67597,
    14983,
    69240,
    675,
    11883,
    89140,
    41869, ]
total_instance_num: 264849

# DataLoaderSettings
dataset_name: 'mimic_cxr'
num_workers: 4
batch_size: 64  # 可以尝试32或128

# ModelSettings - ResNet101优化
vision_model: 'resnet101'
vision_channels: 2048
load_pretrained: True  # 建议使用预训练权重

# TrainerSettings
n_gpu: 1
device: 'cuda'
epochs: 30  # 增加训练轮数
early_stop: 8  # 相应增加早停轮数
monitor_metric: 'mAP'

# Optimization - ResNet101优化设置
loss: 'asl'  # 保持ASL损失，已经很合适
lr: !!float 2e-4  # 提高学习率到更合适的范围
warmup_steps: 1000  # 增加预热步数
weight_decay: 0.01  # 适当降低权重衰减
optimizer: 'adamw'  # 保持AdamW
scheduler: 'cosine_warmup'  # 保持余弦退火+预热

# 可选的学习率候选值进行网格搜索
# lr_candidates: [1e-4, 2e-4, 3e-4, 5e-4]
# weight_decay_candidates: [0.01, 0.03, 0.05] 